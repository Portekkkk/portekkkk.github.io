<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Czyj to lajk?</title>
<meta name="description" content="Imprezowa gra na telefony: zgadnij, kto z Was polubił tego TikToka.">
<meta property="og:title" content="Czyj to lajk?">
<meta property="og:description" content="Wrzucacie swoje polubione TikToki, a reszta zgaduje, kto co polubił.">
<meta name="theme-color" content="#EDEFFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0D25" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23DD1258' d='M12 21c-.3 0-.6-.1-.8-.3C7.4 17.6 2.5 13.7 2.5 9.1 2.5 6.2 4.7 4 7.5 4c1.8 0 3.4.9 4.5 2.4C13.1 4.9 14.7 4 16.5 4c2.8 0 5 2.2 5 5.1 0 4.6-4.9 8.5-8.7 11.6-.2.2-.5.3-.8.3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Layout: one narrow phone column (max 520px). Sticky top bar carries the game code; the main action docks at thumb height. */
:root{
  --bg:#EDEFFA;
  --surface:#FFFFFF;
  --surface-2:#E1E4F4;
  --ink:#17143D;
  --muted:#5A5784;
  --line:#D0D3EA;
  --like:#D6114F;
  --like-soft:#FCE2EB;
  --btn:#DD1258;
  --on-like:#FFFFFF;
  --pop:#FFC23A;
  --ok:#087A4B;
  --ok-soft:#DCF4E8;
  --bad:#C2304A;
  --bad-soft:#FBE3E7;
  --shadow:0 1px 0 rgba(23,20,61,.05),0 12px 28px -18px rgba(23,20,61,.45);
  --f-display:"Unbounded","Arial Black","Helvetica Neue",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F0D25;--surface:#1A1737;--surface-2:#252249;--ink:#F1EFFF;--muted:#A3A0D0;--line:#322E5C;
    --like:#FF5A8C;--like-soft:#3B1736;--btn:#DD1258;--on-like:#FFFFFF;--pop:#FFD35A;
    --ok:#3DD8A0;--ok-soft:#113A33;--bad:#FF7189;--bad-soft:#3F1A2B;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
button,input{font:inherit;color:inherit}
p{margin:0}
a{color:var(--like)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}

/* type */
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.h1{font-size:29px}
.h2{font-size:21px}
.h3{font-size:16px;letter-spacing:0}
.eyebrow{font:800 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.like{color:var(--like)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.4}
.lead{font-size:18px;line-height:1.4;max-width:32ch}

/* layout */
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:28px}
.section{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.center{text-align:center;justify-items:center}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;background:var(--bg)}
.brand{display:inline-flex;align-items:center;gap:8px;font:800 14px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--like)}
.top-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font:800 13px/1 var(--f-body);letter-spacing:.04em;white-space:nowrap}
button.chip{cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad)}
.confirm{display:grid;gap:12px;margin-bottom:16px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--pop);font-size:14px;font-weight:700}

/* buttons */
.btn{appearance:none;-webkit-appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border-radius:16px;font:800 17px/1.15 var(--f-body);text-align:center;text-decoration:none;cursor:pointer;transition:transform .12s ease,opacity .12s ease;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--btn);color:var(--on-like);box-shadow:0 12px 24px -14px var(--btn)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-secondary.danger{color:var(--bad)}
.btn-quiet{background:none;color:var(--muted);min-height:44px;width:auto;padding:0 10px;font-size:15px;font-weight:700}
.btn-quiet.danger{color:var(--bad)}
.w-auto{width:auto}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.busy{opacity:.7;pointer-events:none}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

/* inputs */
.field{display:grid;gap:8px}
.label{font:800 14px/1.2 var(--f-body)}
.input{width:100%;min-height:56px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px/1.2 var(--f-body);-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--muted);opacity:.85}
.input:focus{outline:none;border-color:var(--like);box-shadow:0 0 0 4px var(--like-soft)}
.code-input{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:0 0 0 .3em}
.code-input::placeholder{letter-spacing:.12em}
.join-row .input{flex:1 1 auto;min-width:0}
.join-row .btn{flex:none;width:auto;min-width:112px}
.msg{font-size:14px;font-weight:600;line-height:1.4}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--bad)}
.msg.info{color:var(--muted)}

/* hero */
.hero{display:grid;gap:18px;padding-block:6px 0}
.wordmark{margin:0;font:800 clamp(42px,13vw,64px)/.94 var(--f-display);letter-spacing:-.035em}
.wordmark .q{color:var(--like)}

/* lineup: the police height chart behind the suspects */
.lineup{position:relative;overflow:hidden;display:grid;justify-items:center;gap:14px;padding:22px 16px 18px 48px;border-radius:22px;background-color:var(--surface-2);background-image:repeating-linear-gradient(to bottom,transparent 0 22px,var(--line) 22px 24px)}
.lineup .marks{position:absolute;left:12px;top:14px;bottom:14px;display:flex;flex-direction:column;justify-content:space-between;font:800 10px/1 var(--f-body);letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.suspects-row{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap}
.hero-lineup{padding-block:40px 22px}
.mid{position:relative;display:grid}
.bubble{position:absolute;top:-34px;right:-26px;width:46px;height:42px;display:grid;place-items:center;color:var(--btn);animation:bob 2.6s ease-in-out infinite}
.bubble svg{position:absolute;inset:0;width:100%;height:100%}
.bubble b{position:relative;margin-top:-3px;font:800 17px/1 var(--f-display);color:var(--on-like)}
.placard{display:grid;justify-items:center;gap:6px;min-width:min(260px,100%);max-width:100%;padding:12px 18px 14px;border-radius:12px;background:var(--ink);color:var(--bg);text-align:center}
.placard .pl-k{font:800 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.placard strong{font:800 24px/1.1 var(--f-display);overflow-wrap:anywhere}

/* avatar */
.av{width:var(--s,40px);height:var(--s,40px);flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:var(--cf);font:800 calc(var(--s,40px) * .42)/1 var(--f-display);box-shadow:0 0 0 2px var(--surface)}

/* tiktok player and fallback tile */
.player-wrap{display:grid;justify-items:center;gap:8px}
.player{position:relative;width:min(100%,340px);width:min(100%,calc(56svh * 9 / 16));max-width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:18px;background:#000;box-shadow:var(--shadow)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.open-tt{font-size:14px;font-weight:700;color:var(--muted)}
.tvnote{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.tvnote svg{width:28px;height:28px;flex:none;color:var(--like)}
.tile{display:flex;align-items:stretch;gap:14px;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:transform .12s ease}
.tile:active{transform:scale(.99)}
.thumb{position:relative;flex:none;width:92px;max-width:100%;aspect-ratio:9/16;overflow:hidden;display:grid;place-items:center;border-radius:14px}
.thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 6px,transparent 6px 14px)}
.play{position:relative;z-index:1;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.94);color:#17143D;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.play svg{width:20px;height:20px;margin-left:3px}
.tile-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.handle{font:800 17px/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.tile-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--btn);color:var(--on-like);font:800 15px/1.1 var(--f-body)}
.tile-cta svg{width:16px;height:16px}
.tile.small{padding:10px}
.tile.small .thumb{width:54px;border-radius:10px}
.tile.small .play{width:30px;height:30px}
.tile.small .play svg{width:14px;height:14px;margin-left:2px}
.tile.small .handle{font-size:15px}
.tile.small .tile-cta{min-height:38px;font-size:14px}

/* suspects grid */
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.suspects > :last-child:nth-child(odd){grid-column:1 / -1}
.suspect{position:relative;display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 12px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font:800 16px/1.2 var(--f-body);text-align:left;cursor:pointer;transition:transform .12s ease}
button.suspect:active{transform:scale(.97)}
.suspect .nm{min-width:0}
.suspect[aria-pressed="true"]{background:var(--like-soft);box-shadow:inset 0 0 0 3px var(--like)}
.suspect .tick{position:absolute;top:-7px;right:-7px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--btn);color:var(--on-like);box-shadow:0 0 0 3px var(--bg)}
.suspect .tick svg{width:14px;height:14px}
div.suspect{cursor:default}
.votestatus{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.waitbox{display:grid;gap:12px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.waitlist{display:grid;gap:6px}
.wl{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 4px 4px 8px;border-radius:12px;background:var(--surface-2)}
.wl .btn-quiet{min-height:36px;font-size:14px}
.wl-st{flex:none;padding:5px 8px;border-radius:7px;background:var(--surface);color:var(--muted);font:800 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.wl-st.off{background:var(--bad-soft);color:var(--bad)}
.voters{display:flex;flex-wrap:wrap;gap:6px}
.voter{position:relative;opacity:.38;transition:opacity .2s}
.voter.done{opacity:1}
.voter.done::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}

/* round */
.roundhead{display:grid;gap:8px}
.progress{height:6px;overflow:hidden;border-radius:99px;background:var(--surface-2)}
.progress i{display:block;height:100%;border-radius:inherit;background:var(--like);transition:width .35s ease}

/* reveal */
.outcome{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.outcome strong{font:800 18px/1.2 var(--f-display)}
.outcome span{font-weight:700}
.outcome.ok{background:var(--ok-soft);box-shadow:none}
.outcome.ok strong,.outcome.ok span{color:var(--ok)}
.outcome.no{background:var(--bad-soft);box-shadow:none}
.outcome.no strong{color:var(--bad)}
.outcome.own{background:var(--like-soft);box-shadow:none}
.outcome.own strong{color:var(--like)}
.results{display:grid;gap:6px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:14px;background:var(--surface)}
.res-txt{min-width:0;overflow-wrap:anywhere;font-size:15px}
.res-txt b{font-weight:800}
.arrow{color:var(--muted)}
.res .pts{font:800 14px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.res.ok .pts{color:var(--ok)}
.res.no .pts,.res.none .pts{color:var(--muted)}
.res.own .pts{color:var(--like)}
.mark{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-left:6px;padding:0 7px;border-radius:999px;font:800 11px/1 var(--f-body);letter-spacing:.04em;vertical-align:1px}
.mark.ok{background:var(--ok-soft);color:var(--ok)}
.mark.no{background:var(--bad-soft);color:var(--bad)}
.mark.own{background:var(--like-soft);color:var(--like)}

/* scoreboard */
.board{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:26px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:14px}
.brow:nth-child(odd){background:var(--surface)}
.rank{font:800 13px/1 var(--f-display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bname{min-width:0;font-weight:800;overflow-wrap:anywhere}
.brow.me .bname{color:var(--like)}
.bscore{display:flex;align-items:baseline;gap:8px;font:800 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.delta{font:800 13px/1 var(--f-body);color:var(--ok)}

/* lobby */
.code-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code{display:flex;gap:8px}
.code span{width:54px;height:66px;display:grid;place-items:center;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font:800 30px/1 var(--f-display)}
.share{display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.qr{flex:none;width:124px;height:124px;padding:8px;border-radius:12px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px var(--line)}
.qr svg{display:block;width:100%;height:100%}
.share-txt{flex:1;min-width:0;display:grid;gap:10px}
.share-txt .btn{min-height:48px;font-size:16px}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;border-radius:16px;background:var(--surface)}
.meta{flex:1;min-width:0;display:grid;gap:2px}
.nm{font-weight:800;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.sub.okc{color:var(--ok);font-weight:700}
.tag{flex:none;padding:5px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);font:800 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.pcard{display:grid;overflow:hidden;border-radius:16px;background:var(--surface)}
.pcard .prow{background:none}
.pcard-body{display:grid;gap:12px;padding:2px 12px 14px}
.links{display:grid;gap:6px;max-height:300px;overflow:auto;overscroll-behavior:contain}
.link{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600}
.link .t{flex:1;min-width:0;overflow-wrap:anywhere}
.lstate{flex:none;padding:5px 7px;border-radius:7px;font:800 11px/1 var(--f-body);letter-spacing:.03em;white-space:nowrap}
.lstate.ok{background:var(--ok-soft);color:var(--ok)}
.lstate.out,.lstate.wait{background:var(--surface);color:var(--muted)}
.x{appearance:none;flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.x svg{width:16px;height:16px}
.filebox{display:grid;gap:8px}
details.how{font-size:14px;color:var(--muted)}
details.how summary{padding-block:6px;font-weight:800;color:var(--ink);cursor:pointer}
details.how ol{display:grid;gap:6px;margin:6px 0 0;padding-left:20px}
.seg{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.seg button{appearance:none;min-height:46px;padding:0 6px;border:0;border-radius:12px;background:none;color:var(--muted);font:800 16px/1.15 var(--f-display);cursor:pointer}
.seg.words button{font:800 14px/1.15 var(--f-body)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--like);box-shadow:var(--shadow)}
.note{display:grid;gap:6px;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px}
.note.warn{box-shadow:inset 0 0 0 2px var(--pop)}
.note strong{font-weight:800}

/* dock: main action at thumb height */
.dock{position:sticky;bottom:0;z-index:4;display:grid;gap:8px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -16px 16px -4px var(--bg)}
.dock .btn-quiet{justify-self:center}
.hint{font-size:14px;color:var(--muted);text-align:center}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 16px;border-radius:16px;background:var(--surface);color:var(--muted);font-weight:700;text-align:center}
.waiting::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--like);animation:pulse 1.4s ease-in-out infinite}

/* home */
.steps{display:grid;gap:14px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:12px;counter-increment:st}
.steps li::before{content:counter(st);width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--like);font:800 14px/1 var(--f-display)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}

/* end */
.podium{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-items:end;gap:8px}
.pod{min-width:0;display:grid;justify-items:center;gap:8px;text-align:center}
.pod .nm{font-size:15px}
.pod .sc{font:800 13px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}

    if (so.players.length >= MAX_PLAYERS) { toast('Maksymalnie ' + MAX_PLAYERS + ' graczy.'); return; }
    const key = 'p' + rid(9);
    set(s => { s.solo.players.push({ key, name: n, links: [] }); });
    setName(''); setOpen(key);
  }
  return html`<section class="stack-lg">
    <div class="section">
      <span class="eyebrow">Gra na jednym telefonie</span>
      <h1 class="h1">Kto gra?</h1>
      <p class="muted">Podawajcie sobie telefon. Każdy dodaje swoje TikToki, kiedy reszta nie patrzy, i zwija swoją kartę.</p>
    </div>
    <form class="row" onSubmit=${add} novalidate>
      <label class="sr-only" for="solo-name">Imię gracza</label>
      <input id="solo-name" class="input grow" value=${name} onInput=${e => setName(e.target.value)} maxlength="24" autocomplete="off" enterkeyhint="done" placeholder="Imię gracza" />
      <button class="btn btn-secondary w-auto" type="submit">Dodaj</button>
    </form>
    ${so.players.length ? html`<div class="plist">${so.players.map((p, i) => html`<div class="pcard" key=${p.key}>
      <div class="prow">
        <${Avatar} name=${p.name} col=${i % COLORS.length} />
        <div class="meta"><span class="nm">${p.name}</span><span class=${'sub' + (p.links.length ? ' okc' : '')}>${p.links.length ? nTik(p.links.length) : 'jeszcze bez TikToków'}</span></div>
        <button class="btn btn-quiet" type="button" aria-expanded=${open === p.key} onClick=${() => { setOpen(open === p.key ? null : p.key); setDel(null); }}>${open === p.key ? 'Zwiń' : p.links.length ? 'Edytuj' : 'Dodaj TikToki'}</button>
      </div>
      ${open === p.key ? html`<div class="pcard-body">
        <p class="small muted">${HOW_TO_COPY}</p>
        <${LinkAdder} idp=${'solo-' + p.key} links=${p.links} onChange=${list => set(s => { const t = s.solo.players.find(x => x.key === p.key); if (t) t.links = list; })} />
        ${del === p.key ? html`<div class="row"><button class="btn btn-quiet grow" type="button" onClick=${() => setDel(null)}>Anuluj</button><button class="btn btn-quiet danger grow" type="button" onClick=${() => { set(s => { s.solo.players = s.solo.players.filter(x => x.key !== p.key); }); setOpen(null); setDel(null); }}>Tak, usuń</button></div>`
          : html`<button class="btn btn-quiet danger" type="button" onClick=${() => setDel(p.key)}>Usuń gracza</button>`}
      </div>` : null}
    </div>`)}</div>` : html`<p class="note">Dodaj imiona wszystkich graczy. Potem każdy wkleja swoje polubione TikToki.</p>`}
    <div class="section">
      <span class="label">Liczba rund</span>
      <${RoundsPicker} value=${so.rounds} onChange=${n => set(s => { s.solo.rounds = n; })} />
    </div>
    <div class="dock">
      <button class="btn btn-primary" type="button" disabled=${ready < 2} onClick=${soloStart}>Zaczynamy</button>
      <p class="hint">${ready < 2 ? 'Potrzeba co najmniej 2 osób z TikTokami (najlepiej 3 lub więcej).' : 'Z TikTokami: ' + nOsob(ready) + '.'}</p>
    </div>
  </section>`;
}
function SoloRound() {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  const [ask, setAsk] = useState(false);
  const g = S.solo.g;
  return html`<section class="stack">
    <${RoundHead} G=${g} />
    <${Player} c=${g.l} />
    <div class="section">
      <h2 class="h2">Kto to polubił?</h2>
      <p class="muted">Obejrzyjcie razem i typujcie na głos. Kto polubił, ten udaje, że nic nie wie.</p>
    </div>
    <div class="suspects">${g.pl.map(x => html`<div class="suspect" key=${x[0]}><${Avatar} name=${x[1]} col=${x[2]} /><span class="nm">${x[1]}</span></div>`)}</div>
    <div class="dock">
      <button class="btn btn-primary" type="button" onClick=${() => set(s => { s.solo.g.ph = 'reveal'; s.solo.guessed = {}; })}>Odkryj</button>
      ${ask ? html`<div class="row"><button class="btn btn-quiet grow" type="button" onClick=${() => setAsk(false)}>Anuluj</button><button class="btn btn-quiet danger grow" type="button" onClick=${() => { setAsk(false); soloSkip(); }}>Tak, pomiń</button></div>`
        : html`<button class="btn btn-quiet" type="button" onClick=${() => setAsk(true)}>Film nie działa? Pomiń</button>`}
    </div>
  </section>`;
}
function SoloReveal() {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  const so = S.solo, g = so.g, item = so.deck[g.i - 1];
  const by = keyMap(g.pl);
  const owners = item.o.map(k => by[k]).filter(Boolean);
  const guessers = g.pl.filter(x => !item.o.includes(x[0]));
  const d = scoreRound(item.o, soloVotes());
  return html`<section class="stack">
    <${RoundHead} G=${g} />
    <${LineupReveal} owners=${owners} />
    <div class="section">
      <h2 class="h3">Kto zgadł?</h2>
      <p class="small muted">Zaznacz osoby, które trafiły. Punkty liczą się od razu.</p>
      <div class="suspects">${guessers.map(x => html`<button type="button" class="suspect" key=${x[0]} aria-pressed=${!!so.guessed[x[0]]} onClick=${() => set(s => { s.solo.guessed[x[0]] = !s.solo.guessed[x[0]]; })}>
        <${Avatar} name=${x[1]} col=${x[2]} /><span class="nm">${x[1]}</span>${so.guessed[x[0]] ? html`<span class="tick">${Icon.check()}</span>` : null}
      </button>`)}</div>
    </div>
    <div class="section"><h2 class="h3">Wyniki po ${g.i}. rundzie</h2><${Scoreboard} pl=${g.pl} sc=${addScores(g.sc, d)} d=${d} /></div>
    <div class="dock"><button class="btn btn-primary" type="button" onClick=${soloNext}>${g.i >= g.n ? 'Pokaż wyniki końcowe' : 'Następna runda'}</button></div>
  </section>`;
}

function App() {
  let body;
  if (S.mode === 'multi') body = html`<${Multi} />`;
  else if (S.mode === 'solo' && S.solo) body = html`<${Solo} />`;
  else body = html`<${Home} />`;
  return html`<div class="wrap">
    <${TopBar} />
    ${body}
    ${S.toast ? html`<div class="toast" role="status">${S.toast}</div>` : null}
  </div>`;
}

/* ---------- boot ---------- */
restore(LS.get(STORE));
const hm = (location.hash || '').match(/^#([A-Za-z]{4})$/);
if (hm) {
  S.hashCode = hm[1].toUpperCase();
  if (S.mode === 'multi' && S.code !== S.hashCode) { S.mode = 'home'; S.code = null; S.isHost = false; S.host = null; }
}
root.textContent = '';
rerender();
roomReady = initRelay();
scheduleResolve();
})();
</script>
</body>
</html>
